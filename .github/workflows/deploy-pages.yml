# Robuster Ersatz für die klassische (legacy) Pages-Build-Pipeline, die sporadisch
# hängt/errort. Der Web-Seed wird weiterhin LOKAL gebaut und per `npm run publish:web`
# in den gh-pages-Branch force-gepusht (der Actions-Runner hat den Mac-Store nicht).
# Dieser Workflow liefert den fertigen gh-pages-Inhalt nur noch über Actions aus.
# Trigger: manuell (workflow_dispatch); deploy-web.mjs stösst ihn nach dem Push an.
name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages (fertiger Build)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
